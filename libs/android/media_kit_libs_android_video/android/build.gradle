import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Local native builds stay separate from the published dependency pins.
        def localArm64Path = System.getenv("BOTA_ANDROID_LIBMPV_ARM64_JAR")
        def localArm64SHA256 = System.getenv("BOTA_ANDROID_LIBMPV_ARM64_SHA256")
        def localArm64File = null
        def localJarSHA256 = { candidate ->
            MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(candidate.toPath())).encodeHex().toString()
        }
        if (localArm64Path || localArm64SHA256) {
            if (!localArm64Path || !localArm64SHA256 || !(localArm64SHA256 ==~ /[a-fA-F0-9]{64}/)) {
                throw new GradleException("A local ARM64 libmpv JAR requires its SHA-256 checksum")
            }
            localArm64File = file(localArm64Path)
            if (!localArm64File.isFile()) {
                throw new GradleException("Local ARM64 libmpv JAR does not exist: ${localArm64File}")
            }
            def digest = localJarSHA256(localArm64File)
            if (digest != localArm64SHA256.toLowerCase()) {
                // Never delete a caller's local artifact on failed validation.
                throw new GradleException("SHA-256 verification failed for local ARM64 libmpv JAR")
            }
        }
        def localBundlePath = System.getenv("BOTA_ANDROID_LIBMPV_DIRECTORY")
        def localBundleDir = localBundlePath == null ? file("local_libmpv") :
                (localBundlePath.isEmpty() ? null : file(localBundlePath))
        def localBundleFiles = [:]
        if (localBundleDir != null && (localBundleDir.exists() || localBundlePath)) {
            if (!localBundleDir.isDirectory()) {
                throw new GradleException("Local libmpv bundle directory does not exist: ${localBundleDir}")
            }
            def checksumsFile = new File(localBundleDir, "SHA256SUMS")
            if (!checksumsFile.isFile()) {
                throw new GradleException("A local libmpv bundle requires SHA256SUMS")
            }
            def digests = [:]
            checksumsFile.readLines("UTF-8").findAll { !it.trim().isEmpty() }.each { line ->
                def entry = line.trim() =~ /^([a-fA-F0-9]{64})\s+\*?(default-(?:arm64-v8a|armeabi-v7a|x86_64|x86)\.jar)$/
                if (!entry.matches() || digests.containsKey(entry[0][2])) {
                    throw new GradleException("Invalid or duplicate local libmpv checksum entry")
                }
                digests[entry[0][2]] = entry[0][1].toLowerCase()
            }
            def bundleNames = ["default-arm64-v8a.jar", "default-armeabi-v7a.jar", "default-x86_64.jar", "default-x86.jar"]
            if (digests.keySet() != bundleNames.toSet()) {
                throw new GradleException("A local libmpv bundle must include all four Android ABIs")
            }
            bundleNames.each { name ->
                def candidate = new File(localBundleDir, name)
                if (!candidate.isFile() || localJarSHA256(candidate) != digests[name]) {
                    throw new GradleException("SHA-256 verification failed for local libmpv bundle: ${name}")
                }
                localBundleFiles[name] = candidate
            }
        }
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        def filesToDownload = [
            ["url": "https://github.com/ha1o0/libmpv-android-video-build/releases/download/v1.0.0-android.zcopy.7/default-arm64-v8a.jar", "sha256": "71f1e3f2bffb5c967535e155ff963d93d28dd5681dd5e63d35f763f13b7361b0", "destination": file("$buildDir/v1.0.0-android.zcopy.7/default-arm64-v8a.jar")],
            ["url": "https://github.com/ha1o0/libmpv-android-video-build/releases/download/v1.0.0-android.zcopy.7/default-armeabi-v7a.jar", "sha256": "831facec7550970f3eabf48979d908849a073fac273ef87cc806886c186941a1", "destination": file("$buildDir/v1.0.0-android.zcopy.7/default-armeabi-v7a.jar")],
            ["url": "https://github.com/ha1o0/libmpv-android-video-build/releases/download/v1.0.0-android.zcopy.7/default-x86.jar", "sha256": "d95e3838b8348f0c3ad4543b9d7ca00c1c238113656206eff77cdd60bcb3c22a", "destination": file("$buildDir/v1.0.0-android.zcopy.7/default-x86.jar")],
            ["url": "https://github.com/ha1o0/libmpv-android-video-build/releases/download/v1.0.0-android.zcopy.7/default-x86_64.jar", "sha256": "bc7244808dddd9fbb489172ce69fac0fef6b392611ede78dea444588e90745f7", "destination": file("$buildDir/v1.0.0-android.zcopy.7/default-x86_64.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def localFile = localArm64File != null && fileInfo.destination.name == "default-arm64-v8a.jar" ?
                    localArm64File : localBundleFiles[fileInfo.destination.name]
            def useLocal = localFile != null
            def destFile = useLocal ? localFile : fileInfo.destination
            if (!useLocal && destFile.exists()) {
                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!useLocal && !destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedSHA256 != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)
